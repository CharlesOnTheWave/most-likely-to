name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npx astro check
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - name: Start local Supabase
        run: |
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=' > supabase.env
      # The publishable key (sb_publishable_…), as in production; the legacy anon key would make
      # getPublicSupabaseConfig return null.
      - name: Configure secrets for build and preview
        run: |
          source supabase.env
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$PUBLISHABLE_KEY" > .env
          cp .env .dev.vars
      # Local Supabase keeps "Confirm email" off (supabase/config.toml), so a plain sign-up creates the smoke test account.
      - name: Create smoke test account
        run: |
          source supabase.env
          SMOKE_EMAIL=smoke-host@example.com
          SMOKE_PASSWORD=$(openssl rand -hex 16)
          curl -sf -o /dev/null -X POST "$API_URL/auth/v1/signup" \
            -H "apikey: $PUBLISHABLE_KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"$SMOKE_EMAIL\",\"password\":\"$SMOKE_PASSWORD\"}"
          printf 'SMOKE_EMAIL=%s\nSMOKE_PASSWORD=%s\n' "$SMOKE_EMAIL" "$SMOKE_PASSWORD" >> .dev.vars
      - run: npm run build
      - name: Run smoke test against production preview
        run: |
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          BASE_URL=http://localhost:4321 npm run smoke
      - if: always()
        run: supabase stop --no-backup
